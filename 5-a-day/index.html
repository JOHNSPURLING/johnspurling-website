<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-a-Day Launcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #ff006e;
      --secondary: #00d9ff;
      --violet: #9a5cff;
      --cyan: #24d9ff;
      --pink: #ff5bd7;
      --dark-bg: #0a0e27;
      --card-bg: #1a1f3a;
      --text-primary: #ffffff;
      --text-secondary: #a0a9b8;
      --grid-color: rgba(255, 0, 110, 0.05);
    }

    body {
      background: var(--dark-bg);
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Animated Grid Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(255, 0, 110, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 110, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
      animation: gridPulse 8s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% {
        background-image:
          linear-gradient(rgba(255, 0, 110, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 0, 110, 0.08) 1px, transparent 1px);
      }
      25% {
        background-image:
          linear-gradient(rgba(200, 50, 150, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(200, 50, 150, 0.08) 1px, transparent 1px);
      }
      50% {
        background-image:
          linear-gradient(rgba(100, 100, 200, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(100, 100, 200, 0.08) 1px, transparent 1px);
      }
      75% {
        background-image:
          linear-gradient(rgba(0, 200, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 200, 255, 0.08) 1px, transparent 1px);
      }
    }

    /* Particle Canvas */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 3;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 88px;
      background: linear-gradient(135deg, rgba(10, 14, 39, 0.82), rgba(26, 31, 58, 0.62));
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, var(--primary), var(--secondary)) 1;
      display: flex;
      align-items: center;
      padding: 0 40px;
      z-index: 10;
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1.5px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1;
    }

    .brand-title {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 0, 110, 0.5);
      animation: glow 2s ease-in-out infinite;
    }

    .brand-subtitle {
      color: rgba(255,255,255,0.68);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      -webkit-text-fill-color: initial;
      text-shadow: none;
    }

    .logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 28px rgba(0,217,255,0.28);
    }

    .logo-badge img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(255, 0, 255, 0.45));
    }

    .creator-mark {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: contain;
      margin-left: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 28px rgba(0, 217, 255, 0.26), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 0, 230, 0.28), transparent 32%),
        radial-gradient(circle at 60% 50%, rgba(0, 217, 255, 0.22), transparent 34%),
        linear-gradient(135deg, #050717, #0a0e27 58%, #120424);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-panel {
      width: min(760px, calc(100vw - 40px));
      min-height: min(740px, calc(100vh - 40px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding: 34px;
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035)),
        rgba(10, 14, 39, 0.36);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255,255,255,0.20);
      backdrop-filter: blur(20px) saturate(150%);
      position: relative;
      overflow: hidden;
    }

    .intro-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.12) 42%, transparent 62%);
      transform: translateX(-100%);
      animation: introSweep 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes introSweep {
      0%, 24% { transform: translateX(-100%); }
      58%, 100% { transform: translateX(100%); }
    }

    .intro-media-shell {
      width: min(520px, 78vw);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
    }

    .intro-video,
    .intro-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(0, 217, 255, 0.35));
    }

    .intro-video {
      display: none;
    }

    .intro-overlay.playing .intro-logo {
      display: none;
    }

    .intro-overlay.playing .intro-video {
      display: block;
    }

    .intro-title {
      position: relative;
      z-index: 1;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--text-primary);
      text-shadow: 0 0 26px rgba(255, 0, 230, 0.32);
    }

    .intro-subtitle {
      position: relative;
      z-index: 1;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .intro-start {
      position: relative;
      z-index: 1;
      padding: 16px 24px;
      min-width: 230px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.20);
      color: white;
      background:
        linear-gradient(135deg, rgba(0,217,255,0.28), rgba(255,0,230,0.22)),
        rgba(255,255,255,0.08);
      box-shadow: 0 0 26px rgba(0,217,255,0.24), inset 0 1px 0 rgba(255,255,255,0.24);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(14px);
    }

    .intro-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 38px rgba(255,0,230,0.34), inset 0 1px 0 rgba(255,255,255,0.28);
    }

    .intro-skip {
      position: absolute;
      right: 24px;
      bottom: 20px;
      z-index: 1;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.58);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    body.intro-active .container,
    body.intro-active .header {
      filter: blur(14px);
      transform: scale(1.015);
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 30px rgba(255, 0, 110, 0.5); }
      50% { text-shadow: 0 0 60px rgba(0, 217, 255, 0.8); }
    }

    .header-spacer {
      flex: 1;
    }

    .header-tools {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .tool-link {
      padding: 10px 16px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05)),
        linear-gradient(135deg, rgba(0, 217, 255, 0.20), rgba(255, 0, 110, 0.16));
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.4s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      background-size: 220% 220%;
      animation: gradientShift 6s ease infinite;
      backdrop-filter: blur(16px) saturate(150%);
    }

    .tool-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(255, 0, 110, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .tool-link:focus-visible,
    .cat-btn:focus-visible,
    .btn-action:focus-visible,
    .btn-nav:focus-visible,
    .btn-primary:focus-visible {
      outline: 2px solid rgba(0, 217, 255, 0.9);
      outline-offset: 3px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .tool-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-icon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 0, 255, 0.45));
    }

    .icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .sidebar-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .modal-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .file-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .header-stats {
      display: flex;
      gap: 30px;
      font-size: 14px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 20px;
      border: 2px solid var(--secondary);
      border-radius: 8px;
      background: rgba(0, 217, 255, 0.05);
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: var(--secondary);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: linear-gradient(180deg, rgba(26, 31, 58, 0.72), rgba(10, 14, 39, 0.62));
      border-right: 2px solid;
      border-image: linear-gradient(180deg, var(--primary), var(--secondary)) 1;
      padding: 108px 20px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(18px) saturate(150%);
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      padding-left: 10px;
      border-left: 2px solid var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cat-btn {
      padding: 12px 12px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .cat-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
    }

    .cat-btn.active {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border: none;
      color: var(--dark-bg);
      box-shadow: 0 0 20px rgba(255, 0, 110, 0.8);
    }

    .date-picker-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-input {
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .date-input:hover {
      background: rgba(255, 0, 110, 0.2);
      box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
    }

    .date-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .date-tile {
      padding: 8px;
      background: rgba(26, 31, 58, 1);
      border: 2px solid var(--text-secondary);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .date-tile:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(255, 0, 110, 0.1);
    }

    .date-tile.active {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border: none;
      color: var(--dark-bg);
      box-shadow: 0 0 15px rgba(255, 0, 110, 0.6);
    }

    .sidebar-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .btn-primary {
      padding: 18px 12px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 8px;
      color: var(--dark-bg);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
      font-size: 14px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.8);
    }

    .btn-primary.today {
      padding: 24px 12px;
      font-size: 15px;
      font-weight: 900;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 14px 8px;
      background: rgba(26, 31, 58, 1);
      border: 2px solid var(--primary);
      border-radius: 8px;
      color: var(--primary);
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-nav:hover {
      background: rgba(255, 0, 110, 0.1);
      box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
    }

    /* Month Selector Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 14, 39, 0.95);
      z-index: 100;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease-out;
    }

    .modal.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
      max-width: 1200px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 32px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .modal-close {
      position: absolute;
      top: 40px;
      right: 40px;
      width: 50px;
      height: 50px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 50%;
      color: var(--dark-bg);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255, 0, 110, 0.8);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .month-tile {
      padding: 30px 20px;
      background: rgba(26, 31, 58, 0.8);
      border: 2px solid;
      border-image: linear-gradient(135deg, var(--primary), var(--secondary)) 1;
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .month-tile:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(255, 0, 110, 0.4);
    }

    .month-tile.active {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: var(--dark-bg);
      box-shadow: 0 10px 40px rgba(255, 0, 110, 0.6);
    }

    /* Date Selector Modal */
    .date-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 14, 39, 0.95);
      z-index: 100;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.3s ease-out;
    }

    .date-modal.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .date-modal-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
      max-width: 1200px;
    }

    .date-modal-header {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 28px;
      font-weight: bold;
      color: var(--text-primary);
    }

    .date-grid-full {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    .date-tile-modal {
      padding: 15px;
      background: rgba(26, 31, 58, 0.8);
      border: 2px solid;
      border-image: linear-gradient(135deg, var(--primary), var(--secondary)) 1;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .date-tile-modal:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(255, 0, 110, 0.4);
    }

    .date-tile-modal.active {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: var(--dark-bg);
      box-shadow: 0 5px 20px rgba(255, 0, 110, 0.6);
      border: none;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 100px 40px 40px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-content: start;
      max-width: 100%;
      margin: 0 auto;
      width: 100%;
    }

    .task-card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 0, 110, 0.20), transparent 32%),
        radial-gradient(circle at 88% 20%, rgba(0, 217, 255, 0.18), transparent 34%),
        linear-gradient(135deg, rgba(26, 31, 58, 0.72), rgba(10, 14, 39, 0.58));
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 30px;
      backdrop-filter: blur(18px) saturate(155%);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.18);
      animation: slideIn 0.6s ease-out;
      width: 100%;
    }

    .task-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,0,110,0.75), rgba(0,217,255,0.75), rgba(154,92,255,0.55));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .task-card::after {
      content: '';
      position: absolute;
      top: -60px;
      right: -70px;
      width: 180px;
      height: 180px;
      border-radius: 50%;

  <script>
    // Beautiful Floating Dust Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];

    class DustParticle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.baseSize = Math.random() * 2 + 0.5;
        this.size = 0.1;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.wobbleX = Math.random() * Math.PI * 2;
        this.wobbleY = Math.random() * Math.PI * 2;
        this.wobbleSpeedX = (Math.random() - 0.5) * 0.05;
        this.wobbleSpeedY = (Math.random() - 0.5) * 0.05;
        this.opacity = 0;
        this.maxOpacity = Math.random() * 0.5 + 0.3;
        this.lifetime = Math.random() * 500 + 300;
        this.age = 0;

        const colorPool = ['#ff006e', '#00d9ff', '#ff1493', '#00ffff', '#8844ff'];
        this.color = colorPool[Math.floor(Math.random() * colorPool.length)];
        this.pulsePhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.age++;

        this.wobbleX += this.wobbleSpeedX;
        this.wobbleY += this.wobbleSpeedY;

        this.x += this.speedX + Math.sin(this.wobbleX) * 0.15;
        this.y += this.speedY + Math.cos(this.wobbleY) * 0.1;

        let sizePhase = 1;
        if (this.age < 50) {
          sizePhase = this.age / 50;
        } else if (this.age > this.lifetime - 50) {
          sizePhase = (this.lifetime - this.age) / 50;
        }
        this.size = this.baseSize * sizePhase;

        this.pulsePhase += 0.015;
        const pulse = Math.sin(this.pulsePhase) * 0.2 + 0.8;

        let fadeFactor = 1;
        if (this.age < 50) {
          fadeFactor = this.age / 50;
        } else if (this.age > this.lifetime - 50) {
          fadeFactor = (this.lifetime - this.age) / 50;
        }

        this.opacity = this.maxOpacity * pulse * fadeFactor;

        if (this.x > canvas.width + 30) this.x = -30;
        if (this.x < -30) this.x = canvas.width + 30;
        if (this.y > canvas.height + 30) this.y = -30;
        if (this.y < -30) this.y = canvas.height + 30;

        return this.age <= this.lifetime;
      }

      draw() {
        if (this.size < 0.1) return;

        ctx.globalAlpha = this.opacity * 0.5;

        const glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 5);
        glowGrad.addColorStop(0, this.color);
        glowGrad.addColorStop(0.5, this.color + '80');
        glowGrad.addColorStop(1, 'transparent');

        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = this.opacity * 0.9;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 150; i++) {
      particles.push(new DustParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;

      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].update()) {
          particles[i].draw();
        } else {
          particles.splice(i, 1);
          particles.push(new DustParticle());
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Intro Splash
    const introOverlay = document.getElementById('introOverlay');
    const introVideo = document.getElementById('introVideo');
    const introStartBtn = document.getElementById('introStartBtn');
    const introSkipBtn = document.getElementById('introSkipBtn');
    let introFinished = false;

    function finishIntro() {
      if (introFinished) return;
      introFinished = true;
      introOverlay.classList.add('hidden');
      document.body.classList.remove('intro-active');
      setTimeout(() => {
        introOverlay.remove();
      }, 900);
    }

    async function playIntro() {
      introOverlay.classList.add('playing');
      introStartBtn.textContent = 'Launching...';
      introStartBtn.disabled = true;
      try {
        introVideo.currentTime = 0;
        await introVideo.play();
      } catch (error) {
        finishIntro();
      }
    }

    introStartBtn.addEventListener('click', playIntro);
    introSkipBtn.addEventListener('click', finishIntro);
    introVideo.addEventListener('ended', finishIntro);
    introVideo.addEventListener('error', finishIntro);

    // App Logic
    let resources = null;
    let selectedCategory = null;
    let selectedMonth = null;

    const dateInput = document.getElementById('dateInput');
    const categoryButtons = document.getElementById('categoryButtons');
    const mainContent = document.getElementById('mainContent');
    const todayBtn = document.getElementById('todayBtn');
    const totalCount = document.getElementById('totalCount');
    const monthModal = document.getElementById('monthModal');
    const dateModal = document.getElementById('dateModal');
    const monthGrid = document.getElementById('monthGrid');
    const dateGridFull = document.getElementById('dateGridFull');
    const dateModalMonth = document.getElementById('dateModalMonth');

    const levels = [
      { key: 'numeracy', label: 'Numeracy' },
      { key: 'foundation', label: 'Foundation' },
      { key: 'foundationPlus', label: 'Foundation Plus' },
      { key: 'higher', label: 'Higher' },
      { key: 'higherPlus', label: 'Higher Plus' }
    ];
    const categoryToLevel = Object.fromEntries(levels.map(level => [level.label, level.key]));
    const months = ['September', 'October', 'November', 'December', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August'];
    const calendarMonths = ['January', 'February', 'March', 'April', 'May', 'June',
                            'July', 'August', 'September', 'October', 'November', 'December'];

    // Set today's date
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    // Modal Controls
    function closeMonthModal() {
      monthModal.classList.remove('active');
    }

    function closeDateModal() {
      dateModal.classList.remove('active');
    }

    document.getElementById('monthCloseBtn').addEventListener('click', closeMonthModal);
    document.getElementById('dateCloseBtn').addEventListener('click', closeDateModal);

    function createMonthGrid() {
      monthGrid.innerHTML = '';
      months.forEach(month => {
        const tile = document.createElement('div');
        tile.className = 'month-tile';
        tile.textContent = month;
        tile.onclick = () => selectMonth(month);
        monthGrid.appendChild(tile);
      });
    }

    function selectMonth(month) {
      selectedMonth = month;

      // Update month grid styling
      document.querySelectorAll('.month-tile').forEach(tile => {
        tile.classList.remove('active');
        if (tile.textContent === month) tile.classList.add('active');
      });

      // Show date selector modal
      monthModal.classList.remove('active');
      dateModalMonth.textContent = month;
      createDateGrid(month);
      dateModal.classList.add('active');
    }

    function createDateGrid(month) {
      dateGridFull.innerHTML = '';

      const monthData = getMonthData(month);
      const daysInMonth = monthData ? Object.keys(monthData.days).length : 31;

      for (let i = 1; i <= daysInMonth; i++) {
        const tile = document.createElement('div');
        tile.className = 'date-tile-modal';
        tile.textContent = i;
        tile.onclick = () => selectDate(month, i);
        dateGridFull.appendChild(tile);
      }
    }

    function selectDate(month, day) {
      // Close modal
      dateModal.classList.remove('active');

      const actualMonth = calendarMonths.indexOf(month) + 1;
      const actualYear = month === 'February' && day === 29 ? 2024 : new Date().getFullYear();
      const dateStr = `${actualYear}-${String(actualMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      dateInput.value = dateStr;

      // Load the task
      displayTask();
    }

    function selectMainCardLevel(category, month) {
      selectedCategory = category;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-category') === category);
      });
      displayTask();
      selectedMonth = month;
      dateModalMonth.textContent = month;
      createDateGrid(month);
      dateModal.classList.add('active');
    }

    function getMonthKey(month) {
      return month.toLowerCase();
    }

    function getMonthData(month) {
      return resources && resources.months[getMonthKey(month)];
    }

    function getSelectedResourceDate() {
      if (!dateInput.value) return todayResourceDate();
      const parts = dateInput.value.split('-').map(Number);
      const month = calendarMonths[parts[1] - 1];
      return { month, day: parts[2], year: parts[0] };
    }

    function todayResourceDate() {
      const now = new Date();
      return {
        month: calendarMonths[now.getMonth()],
        day: now.getDate(),
        year: now.getFullYear()
      };
    }

    function setResourceDate(month, day, year = new Date().getFullYear()) {
      const monthNumber = calendarMonths.indexOf(month) + 1;
      const inputYear = month === 'February' && day === 29 ? 2024 : year;
      dateInput.value = `${inputYear}-${String(monthNumber).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function resourceCalendar() {
      const days = [];
      calendarMonths.forEach(month => {
        const monthData = getMonthData(month);
        if (!monthData) return;
        Object.keys(monthData.days)
          .map(Number)
          .sort((a, b) => a - b)
          .forEach(day => days.push({ month, day }));
      });
      return days;
    }

    function moveResourceDate(offset) {
      const selected = getSelectedResourceDate();
      const days = resourceCalendar();
      const index = days.findIndex(item => item.month === selected.month && item.day === selected.day);
      if (index === -1) return;
      const next = days[(index + offset + days.length) % days.length];
      setResourceDate(next.month, next.day, selected.year);
      displayTask();
    }

    function externalAttrs() {
      return 'target="_blank" rel="noopener noreferrer"';
    }

    function icon(name) {
      return `<img class="btn-icon" src="assets/icons/${name}.png" alt="">`;
    }

    function linkButton(url, className, label, iconName) {
      if (!url) {
        return `<button class="btn-action ${className}" disabled>Resource unavailable</button>`;
      }
      return `<a href="${url}" ${externalAttrs()} class="btn-action ${className}">${icon(iconName)}<span>${label}</span></a>`;
    }

    function miniLink(url, label) {
      if (!url) return '';
      return `<a href="${url}" ${externalAttrs()} class="mini-resource-link">${label}</a>`;
    }

    function heroCard(month, day, year, monthData, levelsToShow) {
      const selectedLabel = selectedCategory || 'All five levels';
      const selectedLevel = selectedCategory ? categoryToLevel[selectedCategory] : null;
      const daily = selectedLevel ? monthData.days[String(day)][selectedLevel] || {} : null;
      const monthly = selectedLevel ? monthData.monthly[selectedLevel] || {} : null;
      const quickActions = selectedLevel
        ? `
          <div class="action-buttons">
            ${linkButton(daily.question, 'worksheet', 'Open Questions', 'pdf')}
            ${linkButton(daily.answer, 'answer', 'Open Answers', 'calendar')}
            ${linkButton(monthly.questions, 'booklet', 'Question Booklet', 'math-book')}
            ${linkButton(monthly.answers, 'booklet', 'Answer Booklet', 'pdf')}
          </div>
        `
        : `
          <div class="hero-meta">
            <span class="hero-pill">${levelsToShow.length} levels ready</span>
            <span class="hero-pill">Daily questions and answers</span>
            <span class="hero-pill">${month} booklets included</span>
          </div>
        `;

      return `
        <div class="task-card hero-card">
          <div>
            <div class="hero-kicker">Classroom command centre</div>
            <div class="hero-title">${month} ${day}, ${year}</div>
            <div class="hero-meta">
              <span class="hero-pill">${selectedLabel}</span>
              <span class="hero-pill">Official Corbettmaths links</span>
            </div>
            ${quickActions}
          </div>
          <div class="hero-visual"><img src="assets/icons/graduate.png" alt=""></div>
        </div>
      `;
    }

    function monthResourcesPanel(month, monthData) {
      const questionLinks = levels
        .map(level => miniLink(monthData.monthly[level.key]?.questions, level.label))
        .join('');
      const answerLinks = levels
        .map(level => miniLink(monthData.monthly[level.key]?.answers, level.label))
        .join('');

      return `
        <details class="month-resource-panel">
          <summary>All ${month} Resources</summary>
          <div class="month-resource-grid">
            <div class="month-resource-group">
              <div class="month-resource-heading"><img class="btn-icon" src="assets/icons/math-book.png" alt=""> Questions</div>
              <div class="resource-link-list">${questionLinks}</div>
            </div>
            <div class="month-resource-group">
              <div class="month-resource-heading"><img class="btn-icon" src="assets/icons/pdf.png" alt=""> Answers</div>
              <div class="resource-link-list">${answerLinks}</div>
            </div>
          </div>
        </details>
      `;
    }

    function attributionBlock() {
      return `
        <div class="attribution">
          Resources provided by <a href="https://corbettmaths.com/" ${externalAttrs()}>Corbettmaths</a>.
          This tool links directly to the original resources hosted on corbettmaths.com.
        </div>
      `;
    }

    // Load resources from static index
    function loadFiles() {
      try {
        resources = window.CORBETT_RESOURCES;
        if (!resources || !resources.months) throw new Error('CORBETT_RESOURCES was not loaded');

        // Attach click handlers to category buttons
        const categoryBtns = categoryButtons.querySelectorAll('.cat-btn');
        categoryBtns.forEach(btn => {
          btn.onclick = (e) => {
            selectedCategory = btn.getAttribute('data-category');
            categoryBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            displayTask();
            monthModal.classList.add('active');
            createMonthGrid();
          };
        });

        // Count total files
        const total = Object.values(resources.months).reduce((sum, month) => {
          const daily = Object.values(month.days).reduce((daySum, day) => {
            return daySum + Object.values(day).reduce((linkSum, item) => {
              return linkSum + (item.question ? 1 : 0) + (item.answer ? 1 : 0);
            }, 0);
          }, 0);
          const monthly = Object.values(month.monthly).reduce((linkSum, item) => {
            return linkSum + (item.questions ? 1 : 0) + (item.answers ? 1 : 0);
          }, 0);
          return sum + daily + monthly;
        }, 0);
        totalCount.textContent = total;

        // Auto-load today's task
        displayTask();
      } catch (error) {
        console.error('Error loading resources:', error);
        mainContent.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Error loading resources</div><div class="empty-hint">Make sure data/corbett-resources.js is loaded correctly</div></div>';
      }
    }

    function displayTask() {
      if (!resources) return;

      const selected = getSelectedResourceDate();
      const { month, day, year } = selected;
      const monthData = getMonthData(month);

      mainContent.innerHTML = '';

      if (!monthData || !monthData.days[String(day)]) {
        mainContent.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">No task found for ${month} ${day}</div>
            <div class="empty-hint">Try selecting a different date or category</div>
          </div>
          ${attributionBlock()}
        `;
        return;
      }

      // Search in selected category or all categories
      // Maintain category order: Numeracy, Foundation, Foundation Plus, Higher, Higher Plus
      const levelsToShow = selectedCategory
        ? levels.filter(level => level.label === selectedCategory)
        : levels;

      mainContent.insertAdjacentHTML('beforeend', heroCard(month, day, year, monthData, levelsToShow));

      if (!selectedCategory) {
        levelsToShow.forEach(level => {
          const daily = monthData.days[String(day)][level.key] || {};
          const monthly = monthData.monthly[level.key] || {};
          const taskCard = document.createElement('div');
          taskCard.className = 'task-card level-shortcut';
          taskCard.dataset.level = level.key;
          taskCard.tabIndex = 0;
          taskCard.setAttribute('role', 'button');
          taskCard.setAttribute('aria-label', `Choose ${month} ${level.label} dates`);
          taskCard.title = `Choose a ${month} ${level.label} date`;
          if (level.key === 'numeracy') taskCard.classList.add('numeracy');

          taskCard.innerHTML = `
            <div class="task-header">
              <div class="task-heading">
                <div class="task-level-icon"><img src="assets/icons/graduate.png" alt=""></div>
                <div class="task-date">${month} ${day}, ${year}</div>
              </div>
              <div class="task-category">${level.label}</div>
            </div>
            <div class="resource-section">
              <div class="resource-title">Daily</div>
              <div class="action-buttons">
                ${linkButton(daily.question, 'worksheet', 'Open Questions', 'pdf')}
                ${linkButton(daily.answer, 'answer', 'Open Answers', 'calendar')}
              </div>
            </div>
            <div class="resource-section">
              <div class="resource-title">Monthly Resources</div>
              <div class="action-buttons">
                ${linkButton(monthly.questions, 'booklet', 'Question Booklet', 'math-book')}
                ${linkButton(monthly.answers, 'booklet', 'Answer Booklet', 'pdf')}
              </div>
            </div>
          `;
          taskCard.addEventListener('click', event => {
            if (event.target.closest('a, button')) return;
            selectMainCardLevel(level.label, month);
          });
          taskCard.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            selectMainCardLevel(level.label, month);
          });
          mainContent.appendChild(taskCard);
        });
      }

      const allResourcesCard = document.createElement('div');
      allResourcesCard.className = 'task-card all-month-resources';
      allResourcesCard.innerHTML = `
        <div class="task-header">
          <div class="task-heading">
            <div class="task-level-icon"><img src="assets/icons/calendar.png" alt=""></div>
            <div class="task-date">${month}</div>
          </div>
          <div class="task-category">All Resources</div>
        </div>
        ${monthResourcesPanel(month, monthData)}
      `;
      mainContent.appendChild(allResourcesCard);
      mainContent.insertAdjacentHTML('beforeend', attributionBlock());
    }

    dateInput.addEventListener('change', () => {
      selectedCategory = null;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      displayTask();
    });

    todayBtn.addEventListener('click', () => {
      const today = todayResourceDate();
      setResourceDate(today.month, today.day, today.year);
      selectedCategory = null;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      displayTask();
    });

    document.getElementById('yesterdayBtn').addEventListener('click', () => {
      moveResourceDate(-1);
    });

    document.getElementById('tomorrowBtn').addEventListener('click', () => {
      moveResourceDate(1);
    });

    // Load files on startup
    loadFiles();
  </script>
</body>
</html>
